name: Core CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - name: Verify local HTTP API contract
        run: npm run test:contract
      - run: npm run test:unit
  browser-validation:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      # Use a single browser installation for Chromium, external and load tests.
      # Ubuntu 22.04 GitHub runner already provides the required shared libraries.
      - name: Install Chromium
        run: npx playwright-core install chromium
      - name: Verify isolated runtime prerequisites
        run: bash scripts/prepare-ci-netns.sh
      - name: Verify filesystem and PID sandbox isolation
        run: node --test test/filesystem.test.js
        env:
          PFX_REQUIRE_FS_SANDBOX: '1'
      - name: Chromium integration and security tests
        run: npm test
        env:
          PFX_RUN_BROWSER: '1'
          PFX_REQUIRE_BROWSER_NETWORK: '1'
          PFX_REQUIRE_NETNS: '1'
          PFX_REQUIRE_FS_SANDBOX: '1'
      - name: Browser disconnect recovery and cleanup
        run: npm run bench:soak
        env:
          PFX_SOAK_SECONDS: '25'
          PFX_SOAK_RECOVERY_INTERVAL: '7'
      - name: External HTTPS website compatibility
        if: github.event_name != 'pull_request'
        run: node --test test/integration.test.js
        env:
          PFX_RUN_BROWSER: '1'
          PFX_RUN_EXTERNAL: '1'
          PFX_REQUIRE_BROWSER_NETWORK: '1'
          PFX_REQUIRE_NETNS: '1'
          PFX_REQUIRE_FS_SANDBOX: '1'
      - name: Isolated 10/25/50 Core API stress load
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[load]')
        run: npm run bench:isolated
        env:
          PFX_LOAD_TIERS: '10,25,50'
      - name: Extended isolated browser stability test
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[soak]')
        run: npm run bench:soak
        env:
          PFX_SOAK_SECONDS: '90'

  release-gate:
    # An explicit RC commit launches a 30-minute stability gate and a 20-site matrix.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[rc]'))
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright-core install chromium
      - name: Verify isolated runtime prerequisites
        run: bash scripts/prepare-ci-netns.sh
      - name: Verify 20 public sites with genuine Chromium navigation
        run: npm run bench:compat
        env:
          PFX_COMPAT_MIN_SUCCESS: '15'
          PFX_COMPAT_TIMEOUT_MS: '25000'
      - name: Thirty-minute isolated stability and recovery test
        run: npm run bench:soak
        env:
          PFX_SOAK_SECONDS: '1800'
          PFX_SOAK_RECOVERY_INTERVAL: '20'

  windows-local-smoke:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx playwright-core install chromium
      - name: Verify experimental single-operator Windows Core runtime
        run: node scripts/windows-smoke.js
        env:
          PFX_LOCAL_WINDOWS: '1'
